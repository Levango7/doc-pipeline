[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline-plugin-fact-coverage"
version = "0.1.0"
description = "doc-pipeline 外部插件：fact_coverage Agent（证据密度维度，entry_points 接入，本仓零改动）"
requires-python = ">=3.11"

# 接入契约：group 固定为 doc_pipeline.agents；值是模块路径。
[project.entry-points."doc_pipeline.agents"]
fact_coverage = "doc_pipeline_plugin_fact_coverage.fact_coverage"
