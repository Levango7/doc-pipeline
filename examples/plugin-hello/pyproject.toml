[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline-plugin-hello"
version = "0.1.0"
description = "doc-pipeline 外部插件示例：一个可运行的 char_stats Agent（entry_points 接入，本仓零改动）"
requires-python = ">=3.11"

# 接入契约：group 固定为 doc_pipeline.agents；
# 值是**模块路径**（与内置 agents/*.py 同构：模块级 AGENT_NAME + BaseAgent 子类）。
[project.entry-points."doc_pipeline.agents"]
char_stats = "doc_pipeline_plugin_hello.char_stats"
