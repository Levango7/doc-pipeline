[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-plugin-hello"
version = "0.1.0"
description = "Loom 外部插件示例：一个可运行的 char_stats Agent（entry_points 接入，本仓零改动）"
requires-python = ">=3.11"

readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Levango7"}]
dependencies = ["nexusloom>=3.9.2"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 接入契约：group 固定为 loom.agents；
# 值是**模块路径**（与内置 agents/*.py 同构：模块级 AGENT_NAME + BaseAgent 子类）。
[project.entry-points."loom.agents"]
char_stats = "loom_plugin_hello.char_stats"
