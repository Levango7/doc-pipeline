[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline-plugin-link-check"
version = "0.1.0"
description = "doc-pipeline 外部插件：link_check Agent（链接清单抽取，不发起请求，entry_points 接入）"
requires-python = ">=3.11"

# 接入契约：group 固定为 doc_pipeline.agents；值是模块路径。
[project.entry-points."doc_pipeline.agents"]
link_check = "doc_pipeline_plugin_link_check.link_check"
