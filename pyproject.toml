[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "3.9.1"
description = "Multi-agent document generation pipeline with DAG orchestration, quality gating, and elastic fault tolerance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "selectolax>=0.3.0",       # 经 artesian.selectolax_compat 使用（artesian 未发布前在此显式声明）
    "aiohttp>=3.8.0",          # fetcher 异步 I/O 路径（同步回退需 requests）
    "orjson>=3.0",             # 经 artesian.fast_json 使用（C 实现 3-10x 加速）；同上
    "duckduckgo-search>=4.0.0", # researcher 默认注册的 DuckDuckGo 引擎
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
search = ["duckduckgo-search>=4.0.0"]
benchmark = ["numpy>=1.24.0"]
# 能力包：装了才有，没装则对应节点如实回报跳过原因（不是静默降级）。
# 此前这些依赖只出现在 requirements.txt/Dockerfile 里，`pyproject.toml` 完全没有，
# 于是 `pip install .` 与 `pip install -r requirements.txt` 会装出能力不同的两份东西。
# 版本下限取自本机实测可用版本（本机 python-docx 1.2.0 / reportlab 5.0.0 /
# PyMuPDF 1.27.2.3 / paddleocr 3.7.0 + paddlex 3.7.2），不是猜的。
render = [                      # docpipeline/renderer.py：Markdown → docx / pdf
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
]
ingest = ["pymupdf>=1.24.0"]    # docpipeline/ingest.py：PDF 按字号推断标题层级
ocr = [                         # docpipeline/ingest.py：扫描件/图片 PP-StructureV3 路线
    "paddleocr>=3.0",           # PPStructureV3 是 3.x 的 API，2.x 装了也没有这个符号
    "paddlex[ocr]>=3.0",        # 实测本机只装 paddleocr 时 PPStructureV3 实例化即抛错
]
embed = ["sentence-transformers>=2.2.0"]   # pipeline_core/embeddings.py：local 语义后端
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
# 打包了本机跑得动的全部轻能力。ocr / embed 有意不进：它们分别拉起 PaddleX 与
# torch（GB 级），需要时显式装 `.[ocr]` / `.[embed]`。
all = [
    "aiohttp>=3.8.0",
    "duckduckgo-search>=4.0.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
doc-pipeline = "run:main"

[tool.setuptools]
packages = ["pipeline_core", "docpipeline", "agents", "scripts"]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: 真实端到端测试（调用真实 LLM + 搜索引擎，需 .env 配置，CI 默认跳过）",
    "slow: 慢测试（超时 >60s，默认运行但可用 -m 'not slow' 跳过）",
]

[tool.coverage.run]
# 覆盖率只计产品源码：tests/scripts/benchmark 不入门禁
# （--cov=. 会把 tests/ 自身的近 100% 计入，虚高到 ~79%，无门禁价值）
relative_files = true
include = ["pipeline_core/*", "docpipeline/*", "agents/*", "run.py"]
omit = ["tests/*", "scripts/*", "benchmark.py"]

[tool.coverage.report]
# 门禁 = 2026-08-28 实测基线 85.80%（源码口径、排除 e2e，补测后）- 2，防覆盖率无声滑坡
fail_under = 83
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
disable_error_code = ["valid-type", "attr-defined"]

[[tool.mypy.overrides]]
# 已安装但无类型标注（py.typed 缺失）的第三方包：--ignore-missing-imports 不覆盖 import-untyped
module = ["yaml"]
ignore_missing_imports = true

[tool.bandit]
# B310: urllib 访问 URL —— 全部 11 处均为调用固定的 https 搜索引擎/LLM API 端点，
# scheme 不受外部输入控制（webhook 类 SSRF 已在 event_hook 单独防护），故项目级豁免。
skips = ["B310"]
