[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "3.8.0"
description = "Multi-agent document generation pipeline with DAG orchestration, quality gating, and elastic fault tolerance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "trafilatura>=2.0.0",
    "selectolax>=0.3.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
search = ["duckduckgo-search>=4.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
all = [
    "aiohttp>=3.8.0",
    "duckduckgo-search>=4.0.0",
]

[project.scripts]
doc-pipeline = "run:main"

[tool.setuptools]
packages = ["pipeline_core", "agents", "scripts"]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: 真实端到端测试（调用真实 LLM + 搜索引擎，需 .env 配置，CI 默认跳过）",
    "slow: 慢测试（超时 >60s，默认运行但可用 -m 'not slow' 跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
disable_error_code = ["valid-type", "attr-defined"]

[[tool.mypy.overrides]]
# 已安装但无类型标注（py.typed 缺失）的第三方包：--ignore-missing-imports 不覆盖 import-untyped
module = ["yaml"]
ignore_missing_imports = true

[tool.bandit]
# B310: urllib 访问 URL —— 全部 11 处均为调用固定的 https 搜索引擎/LLM API 端点，
# scheme 不受外部输入控制（webhook 类 SSRF 已在 event_hook 单独防护），故项目级豁免。
skips = ["B310"]
