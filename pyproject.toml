[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "3.3.0"
description = "Multi-agent document generation pipeline with DAG orchestration, quality gating, and elastic fault tolerance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "trafilatura>=2.0.0",
    "selectolax>=0.3.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
search = ["duckduckgo-search>=4.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
all = [
    "aiohttp>=3.8.0",
    "duckduckgo-search>=4.0.0",
]

[project.scripts]
doc-pipeline = "run:main"

[tool.setuptools]
packages = ["pipeline_core", "agents", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: 真实端到端测试（调用真实 LLM + 搜索引擎，需 .env 配置，CI 默认跳过）",
    "slow: 慢测试（超时 >60s，默认运行但可用 -m 'not slow' 跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
disable_error_code = ["valid-type", "attr-defined"]
