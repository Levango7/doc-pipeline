<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc-Pipeline Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>🔧 <span class="accent">Doc-Pipeline</span> Dashboard</h1>
  <div class="header-right">
    <span id="last-updated" class="last-updated">--</span>
    <span class="refresh-indicator"></span>
  </div>
</div>

<!-- Error overlay (hidden by default) -->
<div id="error-overlay" class="error-overlay" style="display:none" role="alert" aria-live="assertive">
  <div class="err-icon">⚠️</div>
  <h2>Dashboard Offline</h2>
  <p id="error-msg">无法连接到 Admin API。请确保 pipeline 已在 <code>--admin</code>/<code>--dashboard</code> 模式下运行。</p>
  <button id="retry-btn" class="retry-btn">重试连接</button>
</div>

<!-- Token prompt (shown on 401 when API key auth is enabled) -->
<div id="token-prompt" class="error-overlay" style="display:none" role="dialog" aria-label="API Token 输入">
  <div class="err-icon">🔑</div>
  <h2>需要 API Token</h2>
  <p>Admin API 已启用鉴权（ADMIN_API_KEY）。输入 Token 后将保存在本浏览器。</p>
  <div style="display:flex;gap:8px;">
    <input id="token-input" type="password" placeholder="ADMIN_API_KEY"
           style="padding:8px 10px;border-radius:8px;border:1px solid var(--border,#444);background:var(--panel,#222);color:inherit;min-width:220px;" />
    <button id="token-save" class="retry-btn">保存并连接</button>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <!-- TOP-LEFT: Pipeline Status -->
  <div class="card" id="panel-status">
    <div class="card-header">
      <h2>📊 Pipeline Status</h2>
      <span id="badge-status" class="badge">--</span>
    </div>
    <div class="card-body"></div>
  </div>

  <!-- TOP-RIGHT: Tasks -->
  <div class="card" id="panel-tasks">
    <div class="card-header">
      <h2>📋 Tasks</h2>
      <span id="badge-tasks" class="badge">0</span>
    </div>
    <div class="card-body">
      <div class="empty-state">
        <div class="icon">📭</div>
        <div>暂无任务</div>
      </div>
    </div>
  </div>

  <!-- FULL-WIDTH: New Task -->
  <div class="card wide" id="panel-newtask">
    <div class="card-header">
      <h2>➕ 新建任务</h2>
      <span id="newtask-status" class="badge">POST /api/tasks</span>
    </div>
    <div class="card-body">
      <form id="newtask-form" class="newtask-form">
        <label for="nt-query">Query（文档主题）</label>
        <textarea id="nt-query" rows="2" placeholder="例如：Python asyncio 并发编程指南" required></textarea>
        <div class="newtask-row">
          <label for="nt-pipeline">Pipeline
            <select id="nt-pipeline"></select>
          </label>
          <label for="nt-output">Output（可选）
            <input id="nt-output" type="text" placeholder="output/my_doc.md">
          </label>
          <button id="nt-submit" type="submit">提交任务</button>
        </div>
        <div id="nt-msg" class="newtask-msg" hidden></div>
      </form>
    </div>
  </div>

  <!-- BOTTOM-LEFT: Agents -->
  <div class="card" id="panel-agents">
    <div class="card-header">
      <h2>🤖 Agents</h2>
      <span id="badge-agents" class="badge">0</span>
    </div>
    <div class="card-body">
      <div class="empty-state">
        <div class="icon">🔌</div>
        <div>暂无 Agent</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM-RIGHT: Metrics -->
  <div class="card" id="panel-metrics">
    <div class="card-header">
      <h2>📈 Metrics</h2>
      <span id="badge-metrics" class="badge">▲</span>
    </div>
    <div class="card-body">
      <div class="empty-state">
        <div class="icon">📊</div>
        <div>等待数据…</div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
