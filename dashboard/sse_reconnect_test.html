<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE 重连测试 — Doc-Pipeline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #00d4ff; margin-bottom: 16px; font-size: 1.4em; }
  .card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #0f3460; }
  .card h2 { color: #00d4ff; font-size: 1.1em; margin-bottom: 12px; }
  .status { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
  .status.connected { background: #0f3460; color: #00ff88; }
  .status.disconnected { background: #3d0000; color: #ff4444; }
  .status.reconnecting { background: #3d3500; color: #ffcc00; }
  #log { height: 400px; overflow-y: auto; background: #0d1117; border-radius: 6px; padding: 12px; font-family: 'Consolas', monospace; font-size: 0.85em; }
  .log-entry { margin-bottom: 4px; padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
  .log-time { color: #666; }
  .log-type { color: #00d4ff; font-weight: bold; }
  .log-data { color: #e0e0e0; }
  .log-reconnect { color: #ffcc00; }
  .log-error { color: #ff4444; }
  .log-replay { color: #00ff88; }
  button { background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.9em; margin-right: 8px; }
  button:hover { background: #1a4a7a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-value { font-size: 1.8em; font-weight: bold; color: #00d4ff; }
  .stat-label { font-size: 0.8em; color: #888; }
  input { background: #0d1117; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 4px; padding: 6px 10px; width: 200px; }
  label { display: inline-block; width: 80px; color: #888; font-size: 0.85em; }
</style>
</head>
<body>
<h1>SSE 重连测试 — Doc-Pipeline</h1>

<div class="card">
  <h2>连接控制</h2>
  <div style="margin-bottom: 12px;">
    <label>API 地址</label><input id="apiUrl" value="http://127.0.0.1:8910" />
  </div>
  <div style="margin-bottom: 12px;">
    <label>查询主题</label><input id="query" value="Python 异步编程" />
  </div>
  <div style="margin-bottom: 12px;">
    <label>文档标题</label><input id="title" value="SSE 重连测试" />
  </div>
  <button id="btnConnect" onclick="connect()">连接</button>
  <button id="btnDisconnect" onclick="disconnect()" disabled>断开</button>
  <button id="btnSimulateDrop" onclick="simulateDrop()" disabled>模拟断线</button>
  <button id="btnClear" onclick="clearLog()">清空日志</button>
  <span style="margin-left: 16px;">状态: <span id="status" class="status disconnected">未连接</span></span>
</div>

<div class="card">
  <h2>统计</h2>
  <div class="stats">
    <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">接收事件</div></div>
    <div class="stat"><div class="stat-value" id="statReconnect">0</div><div class="stat-label">重连次数</div></div>
    <div class="stat"><div class="stat-value" id="statReplay">0</div><div class="stat-label">Replay 事件</div></div>
    <div class="stat"><div class="stat-value" id="statLastId">-</div><div class="stat-label">Last-Event-ID</div></div>
    <div class="stat"><div class="stat-value" id="statDropped">0</div><div class="stat-label">手动断线</div></div>
  </div>
</div>

<div class="card">
  <h2>事件日志</h2>
  <div id="log"></div>
</div>

<script>
let eventSource = null;
let stats = { total: 0, reconnect: 0, replay: 0, lastId: null, dropped: 0 };
let lastEventIdBeforeDrop = null;

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status ' + cls;
}

function addLog(type, data, extraClass) {
  const log = document.getElementById('log');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (extraClass ? ' ' + extraClass : '');
  entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-type">${type}</span> <span class="log-data">${data}</span>`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function updateStats() {
  document.getElementById('statTotal').textContent = stats.total;
  document.getElementById('statReconnect').textContent = stats.reconnect;
  document.getElementById('statReplay').textContent = stats.replay;
  document.getElementById('statLastId').textContent = stats.lastId !== null ? stats.lastId : '-';
  document.getElementById('statDropped').textContent = stats.dropped;
}

function connect() {
  const apiUrl = document.getElementById('apiUrl').value;
  const query = document.getElementById('query').value;
  const title = document.getElementById('title').value;
  const url = `${apiUrl}/stream?query=${encodeURIComponent(query)}&title=${encodeURIComponent(title)}`;

  // EventSource 不支持自定义 header，但浏览器会自动发送 Last-Event-ID
  // 这是 SSE 规范的一部分：重连时浏览器自动携带上次收到的 event id
  eventSource = new EventSource(url);

  eventSource.onopen = function() {
    setStatus('已连接', 'connected');
    addLog('CONNECT', `已连接到 ${url}`);
    document.getElementById('btnConnect').disabled = true;
    document.getElementById('btnDisconnect').disabled = false;
    document.getElementById('btnSimulateDrop').disabled = false;
  };

  eventSource.onmessage = function(event) {
    stats.total++;
    stats.lastId = event.lastEventId;
    updateStats();

    let data;
    try { data = JSON.parse(event.data); } catch { data = event.data; }

    // 检测 replay 事件：如果 event id <= lastEventIdBeforeDrop，说明是 replay
    let isReplay = false;
    if (lastEventIdBeforeDrop !== null && parseInt(event.lastEventId) <= lastEventIdBeforeDrop) {
      isReplay = true;
      stats.replay++;
      updateStats();
    }

    const summary = typeof data === 'object' ? JSON.stringify(data).substring(0, 200) : String(data).substring(0, 200);
    addLog(`EVENT #${event.lastEventId}`, summary, isReplay ? 'log-replay' : '');
  };

  eventSource.onerror = function() {
    stats.reconnect++;
    updateStats();
    setStatus('重连中...', 'reconnecting');
    addLog('ERROR', '连接断开，浏览器将自动重连（携带 Last-Event-ID）', 'log-reconnect');

    // 记录断线前的 lastEventId
    if (stats.lastId !== null) {
      lastEventIdBeforeDrop = parseInt(stats.lastId);
      addLog('RECONNECT', `将携带 Last-Event-ID: ${lastEventIdBeforeDrop} 重连`, 'log-reconnect');
    }
  };

  // 监听自定义事件类型
  ['start', 'section', 'chunk', 'progress', 'complete', 'error'].forEach(type => {
    eventSource.addEventListener(type, function(event) {
      stats.total++;
      stats.lastId = event.lastEventId;
      updateStats();
      let data;
      try { data = JSON.parse(event.data); } catch { data = event.data; }
      const summary = typeof data === 'object' ? JSON.stringify(data).substring(0, 200) : String(data).substring(0, 200);
      addLog(`${type.toUpperCase()} #${event.lastEventId}`, summary);
    });
  });
}

function disconnect() {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
  setStatus('已断开', 'disconnected');
  addLog('DISCONNECT', '手动断开连接');
  document.getElementById('btnConnect').disabled = false;
  document.getElementById('btnDisconnect').disabled = true;
  document.getElementById('btnSimulateDrop').disabled = true;
}

function simulateDrop() {
  // 模拟网络断线：关闭 EventSource 并立即重连
  // 浏览器原生 EventSource 会自动重连，这里手动模拟一次
  if (eventSource) {
    stats.dropped++;
    lastEventIdBeforeDrop = stats.lastId !== null ? parseInt(stats.lastId) : null;
    updateStats();
    addLog('SIMULATE', `模拟断线，当前 Last-Event-ID: ${lastEventIdBeforeDrop}`, 'log-reconnect');

    // 关闭当前连接
    eventSource.close();

    // 延迟 2 秒后重连（浏览器原生 EventSource 会自动重连，这里手动模拟）
    setStatus('模拟断线中...', 'reconnecting');
    setTimeout(() => {
      addLog('RECONNECT', `2 秒后重连，携带 Last-Event-ID: ${lastEventIdBeforeDrop}`, 'log-reconnect');
      connect();
    }, 2000);
  }
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
  stats = { total: 0, reconnect: 0, replay: 0, lastId: null, dropped: 0 };
  lastEventIdBeforeDrop = null;
  updateStats();
}

// 初始化
updateStats();
addLog('INIT', 'SSE 重连测试页已加载。点击"连接"开始测试。');
addLog('HELP', '浏览器 EventSource 断线后会自动携带 Last-Event-ID header 重连，服务端 replay 断线期间错过的事件。');
addLog('HELP', '点击"模拟断线"可手动触发断线-重连流程，观察 replay 行为。');
</script>
</body>
</html>
