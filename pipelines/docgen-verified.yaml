# Doc-Pipeline 声明式流水线配置 — 事实核查增强版
# 质量尾来自共享片段 _quality-tail.yaml；与 docgen 的差别只有一个参数：
# 这一段要做事实核查，且不设分数门槛（min_score: 0，即无条件核查）。
# 用法: python run.py input.md --pipeline docgen-verified
_name: docgen-verified
_version: "1.1"
description: 自动文档生成流水线（Researcher → Fetcher → Writer → 质量尾片段，含无条件事实核查）

defaults:
  parallelism:
    mode: single
    max_workers: 1

# ── Agent 定义 ──────────────────────────────
agents:
  - name: researcher
    version: "2.0"
    timeout: 300
    dependencies: []
    pool_size: 2
    rate_limit:
      rate: 5
      burst: 10
    config:
      search_engines:
        - bocha
        - tavily
        - serper
        - bing
        - sogou
        - "360"
      max_results: 10

  - name: fetcher
    version: "1.0"
    timeout: 120
    dependencies: ["researcher"]
    config:
      max_downloads: 15
      temp_dir: tmp_fetcher

  - name: writer
    version: "2.0"
    timeout: 300
    dependencies: ["fetcher"]
    config:
      prompt_profile: generic-tech

  # 质量尾来自共享片段。这里的取舍是"核查无条件做"：min_score=0 让分数门槛
  # 恒成立，等价于片段里那条 when 只由 fact_check 决定。
  # 想只在对达标稿子付核查成本 → docgen-lean（min_score: 70）。
  - name: quality_tail
    call: _quality-tail
    dependencies: ["writer"]
    inputs:
      fact_check: true
      min_score: 0

# ── DAG 拓扑 ──────────────────────────────
topology:
  type: dag
  levels:
    - [researcher]
    - [fetcher]
    - [writer]
    - [quality_tail]

  edges:
    - [researcher, fetcher]
    - [fetcher, writer]
    - [writer, quality_tail]

# ── 流水线全局策略 ──────────────────────────
pipeline:
  timeout: 600
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
  checkpoint:
    enabled: true
    dir: checkpoints
    keep_on_success: false
  fail_fast: false
