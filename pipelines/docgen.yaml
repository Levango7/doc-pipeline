# Doc-Pipeline 声明式流水线配置示例 (v4 with Fetcher + Multi-Engine)
# 质量尾（QualityGate → Checker → Layout → SafeWriter）来自共享片段
# pipelines/_quality-tail.yaml；本文件只负责"检索→抓取→成稿"和"这段流程要不要核查"。
_name: docgen
_version: "4.1"
description: 自动文档生成流水线（ Researcher → Fetcher → Writer → 质量尾片段 ）

defaults:
  parallelism:
    mode: single
    max_workers: 1

# ── Agent 定义 ──────────────────────────────
agents:
  - name: researcher
    version: "2.0"
    timeout: 300
    dependencies: []
    pool_size: 2
    rate_limit:
      rate: 5
      burst: 10
    config:
      search_engines:
        - bocha
        - tavily
        - serper
        - bing
        - sogou
        - "360"
      max_results: 10

  - name: fetcher
    version: "1.0"
    timeout: 120
    dependencies: ["researcher"]
    config:
      max_downloads: 15
      temp_dir: tmp_fetcher

  - name: writer
    version: "2.0"
    timeout: 300
    dependencies: ["fetcher"]
    config:
      prompt_profile: generic-tech

  # 质量尾（含 fact_checker 这一档）来自共享片段 _quality-tail.yaml。
  # 这条流水线是基线配置：不做事实核查（fact_check: false）。
  # 要核查用 docgen-verified（无条件）或 docgen-lean（达标才查）。
  - name: quality_tail
    call: _quality-tail
    dependencies: ["writer"]
    inputs:
      fact_check: false

# ── DAG 拓扑 ──────────────────────────────
# levels 到 call 节点为止；片段的节点在解析期内联进来，层级由引擎按依赖重算。
topology:
  type: dag
  levels:
    - [researcher]
    - [fetcher]
    - [writer]
    - [quality_tail]

  edges:
    - [researcher, fetcher]
    - [fetcher, writer]
    - [writer, quality_tail]

# ── 流水线全局策略 ──────────────────────────
pipeline:
  timeout: 600
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
  checkpoint:
    enabled: true
    dir: checkpoints
    keep_on_success: false
  fail_fast: false