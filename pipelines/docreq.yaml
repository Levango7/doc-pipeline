# Doc-Pipeline 声明式流水线配置 — 需求分析增强版
# 在 docgen.yaml 基础上，于最前插入 requirements_analyzer（需求分析器）节点：
# 先把用户输入解析为结构化 DocumentSpec，再指导 researcher 检索与 writer 写作。
# 用法: python run.py input.md --pipeline docreq
_name: docreq
_version: "1.0"
description: 需求分析增强流水线（RequirementsAnalyzer → Researcher → Fetcher → Writer → QualityGate → Checker → Layout → SafeWriter）

defaults:
  parallelism:
    mode: single
    max_workers: 1

# ── Agent 定义 ──────────────────────────────
agents:
  - name: requirements_analyzer
    version: "1.0"
    timeout: 60
    dependencies: []
    config:
      confidence_threshold: 0.7
      max_questions: 3
      llm_enabled: true

  - name: researcher
    version: "2.0"
    timeout: 300
    dependencies: ["requirements_analyzer"]
    pool_size: 2
    rate_limit:
      rate: 5
      burst: 10
    config:
      search_engines:
        - bocha
        - tavily
        - serper
        - bing
        - sogou
        - "360"
      max_results: 10

  - name: fetcher
    version: "1.0"
    timeout: 120
    dependencies: ["researcher"]
    config:
      max_downloads: 15
      temp_dir: tmp_fetcher

  - name: writer
    version: "2.0"
    timeout: 300
    dependencies: ["fetcher"]
    config:
      prompt_profile: generic-tech

  - name: quality_tail
    call: _quality-tail
    dependencies: ["writer"]
    inputs:
      fact_check: false

# ── DAG 拓扑 ──────────────────────────────
topology:
  type: dag
  levels:
    - [requirements_analyzer]
    - [researcher]
    - [fetcher]
    - [writer]
    - [quality_tail]

  edges:
    - [requirements_analyzer, researcher]
    - [researcher, fetcher]
    - [fetcher, writer]
    - [writer, quality_tail]

# ── 流水线全局策略 ──────────────────────────
pipeline:
  timeout: 600
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
  checkpoint:
    enabled: true
    dir: checkpoints
    keep_on_success: false
  fail_fast: false
