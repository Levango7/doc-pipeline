# 文档生成 prompt 模板
# 使用 {title} 和 {query} 作为占位符
# sections 列表：每项有 name 和 prompt，prompt 中可使用 {title} 和 {query} 占位符

system_prompt: |
  你是一个资深的数据库技术文档专家。请根据要求生成内容。
  格式：中文 + 专业术语保留英文
  每节至少 3 段详细解释，内容充实深入。
  必须包含：
  - Mermaid 图：```mermaid 包围，首行是 graph LR / graph TD / sequenceDiagram 等
  - 对比表格：标准 markdown 表格
  - 代码块：```sql / ```json 等
  每个产品至少写一段详细原理。
  直接输出 markdown，无需额外说明。

sections:
  - name: "第一篇 关系型数据库（RDBMS）- 第1章 RDBMS 核心原理"
    prompt: |
      # {title}
      ## 第一篇 关系型数据库（RDBMS）  （保持 ## 级别，不要用 #）
      ### 第1章 RDBMS 核心原理
      以下每个主题必须写至少5段深入解释（不是概述！是深入讲原理细节），每点配Mermaid图和SQL代码块：
      - ACID 事务四大特性：原子性(Undo Log回滚机制)/一致性(约束检查+应用逻辑)/隔离性(四种级别与脏读/不可重复读/幻读)/持久性(Redo Log+WAL+Crash Recovery流程)
      - MVCC 多版本并发控制：版本链(DB_TRX_ID+DB_ROLL_PTR)/ReadView可见性判断算法/RC与RR级别下ReadView生成时机差异/回滚段管理
      - 锁机制：行锁/间隙锁/临键锁定义与InnoDB加锁规则/死锁检测(等待图算法)/锁升级与降级
      - 隔离级别：四种级别定义+每种级别下并发问题表现+InnoDB默认RR的实现原理
      - B+Tree 索引：B+Tree数据结构(内部节点+叶子节点+双向链表)/聚簇索引vs非聚簇索引/覆盖索引/索引下推ICP
      - 日志系统：WAL原理/Redo Log(循环写+崩溃恢复)/Undo Log(回滚+MVCC)/Binlog(三种格式+主从复制)/两阶段提交保证Redo与Binlog一致性
      严格要求：不要写'## 第二篇'或任何下一章的内容，专心把第1章写深写透！

  - name: "第一篇 关系型数据库（RDBMS）- 第2章 主流RDBMS对比"
    prompt: |
      （续 ## 第一篇 关系型数据库，保持 ### 章级别）
      ### 第2章 主流RDBMS对比
      用一个对比表格展示以下8个产品的：架构 / 引擎 / 复制方式 / 高可用 / 部署模式 / 适用场景
      表格后对每个产品分别写一段详细介绍（至少100字），覆盖其核心特点和适用场景：
      MySQL / PostgreSQL / Oracle / SQLite / 达梦DM8 / GaussDB / PolarDB / GreatDB
      严格：不要写'## 第二篇'，专心写完第2章就停！

  - name: "第二篇 NoSQL 数据库 - 第1-3章 概述/键值/文档"
    prompt: |
      ## 第二篇 NoSQL 数据库  （保持 ## 级别，不要用 #）
      ### 第1章 NoSQL 概述
      1.1 四大分类(键值/文档/宽列/图) — 深入解释每类数据模型
      1.2 CAP 理论与 BASE 理论 — 原理解析+Mermaid关系图
      1.3 SQL vs NoSQL 数据模型对比表

      ### 第2章 键值数据库
      详细展开以下产品：
      2.1 Redis — 5种数据结构/String/Hash/List/Set/ZSet内部编码+持久化RDB+AOF原理+哨兵Sentinel+集群Cluster分片
      2.2 DynamoDB — 架构/一致性级别/主键设计
      2.3 Tair(阿里自研)
      2.4 Tendis(腾讯自研)

      ### 第3章 文档数据库
      3.1 MongoDB — WiredTiger引擎/B+Tree/MVCC/复制集(选举+oplog)/分片集群(ConfigServer+Shard+Mongos)/聚合管道
      3.2 Couchbase — 架构特点

  - name: "第二篇 NoSQL 数据库 - 第4-5章 宽列/图数据库"
    prompt: |
      （续 ## 第二篇 NoSQL 数据库，保持 ### 章级别）
      ### 第4章 宽列数据库
      4.1 Cassandra — 架构(无中心节点+Gossip)/一致性级别(ONE/QUORUM/ALL)/数据模型(Keyspace+Table+Partition)/LSM-Tree存储
      4.2 HBase — HMaster+RegionServer+HDFS架构/数据模型(RowKey+ColumnFamily+Timestamp)/读写路径/自动分裂

      ### 第5章 图数据库
      5.1 Neo4j — 属性图模型(Label+Node+Relationship+Property)/Cypher查询语言/原生图存储/索引自由邻接
      5.2 图数据库应用场景(社交/推荐/欺诈检测)

  - name: "第三篇 分布式数据库 - 第1章 分布式核心原理"
    prompt: |
      ## 第三篇 分布式数据库  （保持 ## 级别，不要用 #）
      ### 第1章 分布式核心原理
      1.1 数据分片(范围分片/哈希分片/一致性哈希) — 原理+对比+Mermaid图
      1.2 Paxos 共识算法(Basic Paxos两阶段投票原理+Multi-Paxos优化)
      1.3 Raft 共识算法(Leader选举+Follower日志复制+安全性保证)
      1.4 分布式事务(2PC两阶段提交/3PC三阶段提交/TCC Try-Confirm-Cancel/Saga补偿模式) — 详细流程+Mermaid序列图
      1.5 全局时钟(TSO TiDB的PD/TrueTime Spanner的原子钟GPS/HLC CockroachDB的混合逻辑时钟)

  - name: "第三篇 分布式数据库 - 第2-3章 TiDB/CockroachDB"
    prompt: |
      （续 ## 第三篇 分布式数据库，保持 ### 章级别）
      ### 第2章 TiDB
      2.1 整体架构(TiDB SQL层/TiKV存储层/PD调度层) — 详细+架构Mermaid图
      2.2 TiKV原理(RocksDB LSM-Tree+Raft复制)
      2.3 计算存储分离的设计优势
      2.4 部署模式(TiDB Operator on K8s/TiUP)

      ### 第3章 CockroachDB
      3.1 架构原理(SQL Layer+Transaction Layer+Distribution Layer+Storage Layer)
      3.2 事务模型与HLC混合逻辑时钟
      3.3 部署模式(多区域/云原生)

  - name: "第三篇 分布式数据库 - 第4-5章 OceanBase/Spanner"
    prompt: |
      （续 ## 第三篇 分布式数据库，保持 ### 章级别）
      ### 第4章 OceanBase
      4.1 架构原理(LSM-Tree存储+多副本Paxos+OBProxy+OBServer)
      4.2 部署与高可用(三地五中心/两地三中心)
      4.3 与MySQL兼容性(OceanBase MySQL模式)

      ### 第5章 Google Spanner
      5.1 TrueTime与全局一致性 — 深入解释TrueTime API/不确定性窗口/Commit Wait
      5.2 架构原理(Spanserver+Tablet+Paxos Group)
      5.3 部署模式(Google Cloud Spanner)

  - name: "第四篇 OLAP 分析型数据库"
    prompt: |
      ## 第四篇 OLAP 分析型数据库  （保持 ## 级别，不要用 #）
      ### 第1章 OLAP 概述
      1.1 OLTP vs OLAP对比（表格：数据模型/访问模式/事务/响应时间/典型系统）
      1.2 列式存储原理 — 深入解释列式存储IO减少/高压缩比/向量化执行
      1.3 MPP架构 — 大规模并行处理的coordinator+worker模型

      ### 第2章 ClickHouse
      2.1 列式存储与MergeTree引擎家族(MergeTree/ReplacingMergeTree/SummingMergeTree/ CollapsingMergeTree)
      2.2 数据复制与分片(ReplicatedMergeTree+Distributed表)
      2.3 部署模式(单机/集群/云)
      2.4 性能特点与适用场景

      ### 第3章 Apache Doris
      3.1 FE+BE架构 / MPP引擎
      3.2 三种存储模型(明细Duplicate/聚合Aggregate/唯一键Unique)
      3.3 数据导入(Broker Load/Stream Load/Routine Load)与查询
      3.4 部署模式与适用场景
