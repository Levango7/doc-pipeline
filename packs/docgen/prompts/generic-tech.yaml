# 通用技术文档 prompt 模板
# 使用 {title} 和 {query} 作为占位符，动态适配任意技术主题
# sections 列表：每项有 name 和 prompt，prompt 中可使用 {title} 和 {query} 占位符

system_prompt: |
  你是一个资深的技术文档专家。请根据要求生成关于「{query}」的技术文档。
  格式：中文 + 专业术语保留英文
  每节至少 3 段详细解释，内容充实深入。
  必须包含：
  - Mermaid 图：```mermaid 包围，首行是 graph LR / graph TD / sequenceDiagram 等
  - 对比表格：标准 markdown 表格
  - 代码块：根据主题使用合适的语言（如 ```java / ```python / ```yaml / ```bash 等）
  直接输出 markdown，无需额外说明。

sections:
  - name: "概述与背景"
    prompt: |
      # {title}
      ## 概述与背景
      请深入介绍 {query} 的以下方面（每点至少 2 段详细解释）：
      - 什么是 {query}：定义、核心概念、解决什么问题
      - 发展历史与背景：起源、演进历程、当前版本与生态
      - 核心术语速查表：用 markdown 表格列出 5-8 个关键术语及简要说明
      - 与同类技术/方案的对比：用表格对比 2-3 个竞品，维度包括定位、优劣势、适用场景

  - name: "核心架构与原理"
    prompt: |
      ## 核心架构与原理
      请深入讲解 {query} 的架构设计和工作原理（每点至少 3 段深入解释，配 Mermaid 架构图）：
      - 整体架构：组件划分、各组件职责、组件间交互关系（Mermaid graph 图）
      - 核心数据模型/数据结构：内部如何组织和存储数据
      - 关键算法与机制：核心流程的工作原理（如读写流程、请求处理流程等，配 Mermaid sequenceDiagram）
      - 设计哲学与权衡：架构决策背后的原因，做了哪些 trade-off

  - name: "关键特性与机制"
    prompt: |
      ## 关键特性与机制
      请详细讲解 {query} 的核心特性（每点至少 2 段解释，配代码示例）：
      - 性能特性：吞吐量/延迟特点、性能优化机制
      - 可靠性/高可用：容错机制、副本/持久化策略、故障恢复流程
      - 扩展性：水平/垂直扩展方式、分区/分片机制
      - 安全性：认证/授权/加密机制（如有）
      - 其他关键特性：根据 {query} 的特点选择 2-3 个最重要的特性深入展开

  - name: "实践应用与部署"
    prompt: |
      ## 实践应用与部署
      请提供 {query} 的实践指导（每点至少 2 段，配代码/配置示例）：
      - 快速上手：安装/部署步骤（```bash 或 ```yaml 代码块）
      - 基础配置：核心配置项说明 + 示例配置文件
      - 典型使用场景：2-3 个常见应用场景，每个场景给出代码示例
      - 生产环境最佳实践：容量规划、监控指标、常见陷阱与避坑指南
      - 性能调优：关键调优参数和效果说明

  - name: "总结与参考"
    prompt: |
      ## 总结与参考
      请总结 {query} 的核心要点：
      - 核心优势：用表格列出 3-5 个优势及简述
      - 适用场景与不适用场景：分别列出
      - 学习路线建议：从入门到精通的推荐路径
      - 参考资料：列出官方文档、优秀博客、开源项目等资源链接
