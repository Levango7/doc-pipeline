# Doc-Pipeline 声明式流水线配置 — 成本分级版事实核查
# 质量尾（quality_gate → checker → fact_checker → layout → safe_writer）来自
# 共享片段 _quality-tail.yaml，与 docgen / docgen-render / docgen-verified 同一段流程。
# 这条流水线的选择是：核查只花在已经达标的草稿上（min_score: 70）。
# 理由（成本，不是质量取舍）：质量门控没过的稿子迟早要重做，为它花一轮
# LLM 事实核查是浪费。
# ⚠ 需要"无条件核查"请用 docgen-verified —— 这条流水线的核查是达标后的升级。
# 用法: python run.py input.md --pipeline docgen-lean
_name: docgen-lean
_version: "1.1"
description: 文档生成流水线，事实核查按质量分升级触发（quality_gate 达标才核查）

defaults:
  parallelism:
    mode: single
    max_workers: 1

# ── Agent 定义 ──────────────────────────────
agents:
  - name: researcher
    version: "2.0"
    timeout: 300
    dependencies: []
    pool_size: 2
    rate_limit:
      rate: 5
      burst: 10
    config:
      search_engines:
        - bocha
        - tavily
        - serper
        - bing
        - sogou
        - "360"
      max_results: 10

  - name: fetcher
    version: "1.0"
    timeout: 120
    dependencies: ["researcher"]
    config:
      max_downloads: 15
      temp_dir: tmp_fetcher

  - name: writer
    version: "2.0"
    timeout: 300
    dependencies: ["fetcher"]
    config:
      prompt_profile: generic-tech

  # 质量尾整段来自共享片段：这一段的行为（含 fact_checker 的条件）定义在
  # pipelines/_quality-tail.yaml，这里只声明"这条流水线要什么样的核查"。
  # min_score=70 与 quality_gate 的达标线一致：不达标的稿子不付核查成本。
  - name: quality_tail
    call: _quality-tail
    dependencies: ["writer"]
    inputs:
      fact_check: true
      min_score: 70

# ── DAG 拓扑 ──────────────────────────────
# levels 只写到 call 节点为止：展开（内联片段、将依赖接到片段的出口）后层级由引擎
# 按依赖重算，手写的层级不再描述这张图。见 docs/architecture.md 的子流水线一节。
topology:
  type: dag
  levels:
    - [researcher]
    - [fetcher]
    - [writer]
    - [quality_tail]

  edges:
    - [researcher, fetcher]
    - [fetcher, writer]
    - [writer, quality_tail]

# ── 流水线全局策略 ──────────────────────────
pipeline:
  timeout: 600
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
  checkpoint:
    enabled: true
    dir: checkpoints
    keep_on_success: false
  fail_fast: false
