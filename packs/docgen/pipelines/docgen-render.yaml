# Doc-Pipeline 多格式渲染流水线 (v1)
# 用途：在既有 docgen 链路后追加渲染环节，产出 docx / pdf 交付格式。
#
# 设计取舍：独立 pipeline 而非改 docgen ——
#   docgen 是既有主链路，被广泛使用与回归覆盖；改它会牵动 lockfile、
#   配置哈希与既有测试。独立 pipeline 保持默认行为完全不变，
#   需要多格式时显式 `--pipeline docgen-render`。
_name: docgen-render
_version: "1.0"
description: 文档生成 + 多格式渲染流水线（Researcher → … → Layout → SafeWriter → Renderer）

defaults:
  parallelism:
    mode: single
    max_workers: 1

# ── Agent 定义 ──────────────────────────────
agents:
  - name: researcher
    version: "2.0"
    timeout: 300
    dependencies: []
    pool_size: 2
    rate_limit:
      rate: 5
      burst: 10
    config:
      search_engines:
        - bocha
        - tavily
        - serper
        - bing
        - sogou
        - "360"
      max_results: 10

  - name: fetcher
    version: "1.0"
    timeout: 120
    dependencies: ["researcher"]
    config:
      max_downloads: 15
      temp_dir: tmp_fetcher

  - name: writer
    version: "2.0"
    timeout: 300
    dependencies: ["fetcher"]
    config:
      prompt_profile: generic-tech

  # 质量尾来自共享片段 _quality-tail.yaml：与 docgen 完全同一段流程、同一份配置，
  # 这里同样不做事实核查。
  - name: quality_tail
    call: _quality-tail
    dependencies: ["writer"]
    inputs:
      fact_check: false

  # 渲染节点：Markdown → docx / pdf
  # 后端（python-docx / reportlab）为可选依赖，缺失时该节点如实回报跳过原因，
  # 不影响 Markdown 主产物 —— 渲染是增强而非前置。
  - name: renderer
    version: "1.0"
    timeout: 120
    dependencies: ["quality_tail"]     # 展开后自动接到片段的出口（safe_writer）
    config:
      formats: ["docx", "pdf"]
      output_dir: output

# ── DAG 拓扑 ──────────────────────────────
topology:
  type: dag
  levels:
    - [researcher]
    - [fetcher]
    - [writer]
    - [quality_tail]
    - [renderer]             # 渲染依赖落盘完成，确保 Markdown 已定稿
  edges:
    - [researcher, fetcher]
    - [fetcher, writer]
    - [writer, quality_tail]
    - [quality_tail, renderer]

# ── 流水线全局策略 ──────────────────────────
pipeline:
  timeout: 600
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
  checkpoint:
    enabled: true
    dir: checkpoints
    keep_on_success: false
  fail_fast: false