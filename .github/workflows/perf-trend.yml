name: Perf Trend

on:
  schedule:
    # 每月 1 日 00:00 UTC 跑一次
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Run benchmarks (CI mode)
        run: python benchmark.py --ci --threshold 0.30

      - name: Upload trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: benchmark_history.jsonl
          retention-days: 365
