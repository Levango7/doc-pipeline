name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-cov>=5.0" "pytest-asyncio>=0.23" "ruff>=0.4.0" "mypy>=1.10.0" "bandit>=1.7.0" "pip-audit>=2.7.0"

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile pipeline_core/*.py agents/*.py run.py
          echo "SYNTAX OK"

      - name: Type check (mypy)
        run: |
          mypy pipeline_core/ agents/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html

      - name: Security scan (bandit)
        run: |
          bandit -c pyproject.toml -ll -r pipeline_core agents -f json -o bandit-report.json

      - name: Dependency audit (pip-audit)
        run: |
          # 失败时通过 pip freeze + 完整审计输出定位根因（可归因，不降级安全门）。
          # 首次见到某 Python 版本单独在 OSV 审计失败多为数据源偶发或该解释器特有的
          # 依赖解析组合；先打印依赖清单便于下轮归因。
          python -m pip freeze > /tmp/deps.txt
          if pip-audit --timeout 30 -f json; then
            echo "PIP-AUDIT OK"
          else
            echo "=== deps.txt (for root-cause attribution) ==="
            cat /tmp/deps.txt
            echo "=== pip-audit detailed output on failure ==="
            pip-audit --timeout 30
            exit 1
          fi

      - name: Pipeline smoke test (docgen)
        run: |
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md
          test -f /tmp/out_ci.md && echo "PIPELINE SMOKE OK"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build validation
        run: |
          docker build -t doc-pipeline:ci .
          echo "DOCKER BUILD OK"

  perf-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Performance regression check
        run: |
          python benchmark.py --ci --threshold 0.30
          echo "PERF CHECK PASSED"
