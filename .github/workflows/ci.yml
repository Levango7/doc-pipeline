name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check (all modules)
        run: |
          python -m py_compile pipeline_core/*.py agents/*.py run.py
          echo "SYNTAX OK"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Pipeline smoke test (docgen)
        run: |
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md
          test -f /tmp/out_ci.md && echo "PIPELINE SMOKE OK"
