name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy bandit pip-audit

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile pipeline_core/*.py agents/*.py run.py
          echo "SYNTAX OK"

      - name: Type check (mypy)
        run: |
          mypy pipeline_core/ agents/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html

      - name: Security scan (bandit)
        continue-on-error: true
        run: |
          bandit -r pipeline_core/ -r agents/ -f json -o bandit-report.json

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip-audit

      - name: Pipeline smoke test (docgen)
        run: |
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md
          test -f /tmp/out_ci.md && echo "PIPELINE SMOKE OK"
