name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试工具链钉版本：浮动安装会在上游发新版时随机打红 CI。
          # 实证教训（2026-08）：pytest>=8.0 漂到 9.1.1 + coverage 7.16.0 后，
          # Python 3.14 上 _sqlite3 C 模块段错误（exit 139），4 个版本矩阵全红。
          # 版本组合 = 本地全量验证过的组合（1423 passed / win + ubuntu）。
          pip install "pytest==8.3.4" "pytest-cov==7.1.0" "coverage==7.15.2" "pytest-asyncio==0.25.2" "ruff==0.16.4" "mypy==1.20.2" "types-PyYAML" "bandit>=1.7.0" "pip-audit>=2.7.0"

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile pipeline_core/*.py agents/*.py run.py
          echo "SYNTAX OK"

      - name: Type check (mypy)
        run: |
          mypy pipeline_core/ agents/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          # bare --cov 采用 pyproject [tool.coverage.run] 的源码口径（pipeline_core/agents/run.py，
          # 不含 tests/），并由 [tool.coverage.report] fail_under=63 门禁：覆盖率跌破阈值即红。
          python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=html

      - name: Security scan (bandit)
        run: |
          bandit -c pyproject.toml -ll -r pipeline_core agents -f json -o bandit-report.json

      - name: Dependency audit (pip-audit)
        run: |
          set +e
          # 只审计项目声明的依赖（requirements.txt），而非整个运行环境——
          # 后者会误报 CI runner 无关的全局包。JSON 成功且解析出真实漏洞才阻断；
          # 进程故障（数据源/运行时）在本地已权威确认依赖安全的前提下告警不误伤。
          echo "=== auditing requirements.txt ==="
          python -m pip_audit -r requirements.txt --timeout 30 -f json -o /tmp/audit.json
          audit_rc=$?
          if [ $audit_rc -eq 0 ]; then
            python -c "import json,sys;d=json.load(open('/tmp/audit.json',encoding='utf-8'));bad=[(x.get('name'),x.get('version'),[z.get('id') for z in x.get('vulns',[])]) for x in d.get('dependencies',[]) if x.get('vulns')];print('VULNS:',bad);sys.exit(1 if bad else 0)"
            rc=$?
          else
            echo "pip-audit process failed (rc=$audit_rc) on data-source/runtime; see stack above"
            rc=0
          fi
          exit $rc

      - name: Pipeline smoke test (docgen)
        run: |
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md
          test -f /tmp/out_ci.md && echo "PIPELINE SMOKE OK"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build validation
        run: |
          docker build -t doc-pipeline:ci .
          echo "DOCKER BUILD OK"

  perf-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Restore perf baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmark_results.json
          key: perf-baseline-${{ github.ref_name }}
          restore-keys: |
            perf-baseline-

      - name: Performance regression check
        run: |
          python benchmark.py --ci --threshold 0.30
          echo "PERF CHECK PASSED"

      # 仅 main 更新滚动基线（benchmark.py 在对比通过后会重写 benchmark_results.json）
      - name: Save perf baseline
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmark_results.json
          key: perf-baseline-main-${{ github.run_id }}
