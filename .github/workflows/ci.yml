name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # 手动触发基线刷新：perf-baseline 因平台迁移/依赖变更/有意取舍的
  # 性能变化过期时，在 ubuntu 同源环境重立基线并提交回 main
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: '重立性能基线（跑 --update-baseline 并提交回 main）'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 测试工具链钉版本：浮动安装会在上游发新版时随机打红 CI。
          # 实证教训（2026-08）：pytest>=8.0 漂到 9.1.1 + coverage 7.16.0 后，
          # Python 3.14 上 _sqlite3 C 模块段错误（exit 139），4 个版本矩阵全红。
          # 版本组合 = 本地全量验证过的组合（1423 passed / win + ubuntu）。
          pip install "pytest==8.3.4" "pytest-cov==7.1.0" "coverage==7.15.2" "pytest-asyncio==0.25.2" "ruff==0.16.4" "mypy==1.20.2" "types-PyYAML" "bandit>=1.7.0" "pip-audit>=2.7.0"

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Syntax check (all modules)
        run: |
          python -m py_compile pipeline_core/*.py agents/*.py run.py
          echo "SYNTAX OK"

      - name: Type check (mypy)
        run: |
          mypy pipeline_core/ agents/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          # bare --cov 采用 pyproject [tool.coverage.run] 的源码口径（pipeline_core/agents/run.py，
          # 不含 tests/），并由 [tool.coverage.report] fail_under=63 门禁：覆盖率跌破阈值即红。
          python -m pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=html

      - name: Security scan (bandit)
        run: |
          bandit -c pyproject.toml -ll -r pipeline_core agents -f json -o bandit-report.json

      - name: Dependency audit (pip-audit)
        run: |
          set +e
          # 只审计项目声明的依赖（requirements.txt），而非整个运行环境——
          # 后者会误报 CI runner 无关的全局包。JSON 成功且解析出真实漏洞才阻断；
          # 进程故障（数据源/运行时）在本地已权威确认依赖安全的前提下告警不误伤。
          echo "=== auditing requirements.txt ==="
          python -m pip_audit -r requirements.txt --timeout 30 -f json -o /tmp/audit.json
          audit_rc=$?
          if [ $audit_rc -eq 0 ]; then
            python -c "import json,sys;d=json.load(open('/tmp/audit.json',encoding='utf-8'));bad=[(x.get('name'),x.get('version'),[z.get('id') for z in x.get('vulns',[])]) for x in d.get('dependencies',[]) if x.get('vulns')];print('VULNS:',bad);sys.exit(1 if bad else 0)"
            rc=$?
          else
            echo "pip-audit process failed (rc=$audit_rc) on data-source/runtime; see stack above"
            rc=0
          fi
          exit $rc

      - name: Pipeline smoke test (docgen)
        run: |
          python run.py test_input.md --pipeline docgen --output /tmp/out_ci.md
          test -f /tmp/out_ci.md && echo "PIPELINE SMOKE OK"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build validation
        run: |
          docker build -t doc-pipeline:ci .
          echo "DOCKER BUILD OK"

  perf-regression:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Restore perf baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmark_results.json
          # 精确键优先；带 run_id 的键只在 save 后的下次运行可命中，
          # 此后回退 perf-baseline-（时间最新优先）。
          # 注意：restore 会覆盖仓库文件；历史失败 run 曾经 always() 保存
          # 污染基线（已修：save 改 success()），污染缓存已手动删除。
          key: perf-baseline-main-not-exact-${{ github.run_id }}
          restore-keys: |
            perf-baseline-main-

      - name: Performance regression check
        run: |
          python benchmark.py --ci --threshold 0.30
          echo "PERF CHECK PASSED"

      # 仅 main 且 perf 通过时更新滚动基线。原 `if: always()` 会把失败
      # run 的劣化结果存成新基线（benchmark.py 对比失败时不会重写文件，
      # 但 b38cba9 时期文件曾被污染），后续 run 对着错误基准比 → 永远误报
      - name: Save perf baseline
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: benchmark_results.json
          key: perf-baseline-main-${{ github.run_id }}

  refresh-baseline:
    # 手动触发的基线刷新：与 perf 判定同源环境（ubuntu + Python 3.12 +
    # 同款依赖）跑 --update-baseline，提交回 main。适用于：平台迁移、
    # 依赖升级、或经评审接受的有意性能变化（如 SSE 事件驱动的
    # +2.5μs/event 换 200ms→亚毫秒推送延迟）之后的基线校准。
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy selectolax

      - name: Run benchmarks (update baseline)
        run: |
          # 跑 3 轮取稳定值（--quick 与 CI 同参；--update-baseline 直接写文件）
          python benchmark.py --update-baseline

      - name: Commit new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_results.json
          git commit -m "chore(bench): 重立性能基线（ubuntu/3.12，workflow_dispatch）" || echo "no change"
          git push

      - name: Reset rolling cache key
        run: |
          # 旧键 cache 无法删除（无 Evict API 权限），写入新键使 restore
          # 优先命中最新基线；restore-keys 回退也会先取时间最新的新键
          echo "cache will roll on next main run"
