name: Release Plugins

# 六个 examples/plugin-* 是独立 PyPI 发行物（各自的 project.name）。
# 本工作流一次构建全部、verify 后统一上传（Trusted Publishing/OIDC）。
# 每个插件项目在 PyPI 控制台的 pending publisher 都指向本工作流
# （owner=Levango7 / repo=doc-pipeline / workflow=release-plugins.yml /
# environment=pypi）——登记表见 README「发布（PyPI）」。
#
# 只在 workflow_dispatch 且 dry_run=false 时真上传；平时只构建与校验。
# 插件版本各自独立，升级某个插件时改它的 pyproject version 即可
# （PyPI 同版本重传会被拒，这是预期的防呆）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建与校验，不上传 PyPI"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PLUGINS: "plugin-hello plugin-keyword-extract plugin-readability plugin-link-check plugin-fact-coverage plugin-tldr"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build all six plugins
        run: |
          mkdir -p dist
          for p in $PLUGINS; do
            echo "== building $p =="
            python -m build "examples/$p" --outdir dist
          done
          ls -l dist

      - name: Twine check（上传期硬校验的本地预演）
        run: python -m twine check --strict dist/*

      - name: Verify metadata（名称 / entry_points group / 宿主依赖）
        run: |
          python - <<'PY'
          import glob, tomllib, zipfile
          wheels = sorted(glob.glob("dist/*.whl"))
          assert len(wheels) == 6, f"期望 6 个 wheel，实际 {len(wheels)}"
          for whl in wheels:
              z = zipfile.ZipFile(whl)
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              txt = z.read(meta).decode("utf-8")
              assert "Requires-Dist: doc-pipeline" in txt, whl
              name = next(l for l in txt.splitlines() if l.startswith("Name:"))
              print("OK", name)
          PY

      - name: Upload dist（publish 用的就是这份字节）
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist from verify
        uses: actions/download-artifact@v4
        with:
          name: plugin-dist
          path: dist

      - name: Show what will be published
        run: ls -l dist

      - name: Publish all six to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
